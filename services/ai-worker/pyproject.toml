[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "capzee-worker"
version = "0.1.0"
description = "Capzee AI worker for speech transcription and video rendering"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    # NOTE: faster-whisper requires Python < 3.13 officially
    # On Python 3.14, use at your own risk or use openai-whisper as fallback
    # faster-whisper is listed here but may need to be installed separately
    # "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.0.0",
    "numpy>=1.24.0",
]
whisperx = [
    "whisperx>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["capzee_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
