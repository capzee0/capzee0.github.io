        value: https://capzee0.github.io
      - key: CAPZEE_PROCESSING_MODE
        value: local
      - key: SUPABASE_URL
        value: https://zmpimzfwqcmjqkrisxej.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_10VFscGJGtkahLxCZmoSiw_FehkqHUV
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
