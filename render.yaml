services:
  - type: web
    name: capzee0-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=@capzee/contracts && npm run build --workspace=@capzee/api
    startCommand: npm run start --workspace=@capzee/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
