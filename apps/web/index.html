<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/capzee-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capzee — AI Video Captioning</title>
    <meta name="description" content="Capzee — AI-powered video captioning, subtitle editing, and social media caption generation for content creators." />
    <meta name="keywords" content="video captions, subtitles, AI transcription, Instagram Reels, YouTube Shorts, content creator" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@700&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700&family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
