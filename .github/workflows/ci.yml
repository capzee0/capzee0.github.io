name: Capzee CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/ai-worker/pyproject.toml'

      - name: Install Node Dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci || npm install

      - name: Build Shared Contracts
        run: npm run build --workspace=packages/contracts

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic

      - name: Lint TypeScript Workspaces
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Node.js Test Suites (Web, API, Contracts)
        run: npm test

      - name: Run Python Worker Tests (Captions, Inspector, Renderer)
        run: python -m pytest services/ai-worker/tests/

      - name: Build All Workspaces (Contracts, Web, API, Desktop)
        run: npm run build
